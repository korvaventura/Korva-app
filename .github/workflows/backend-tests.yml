name: Backend - pruebas de progreso
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Probar backend (concurrencia limitada)
        run: npm test -- --test-concurrency=2
      - name: Probar generación de PDF (sin servicios externos)
        run: python3 -m unittest discover -s tests -p 'test_generar_certificado.py' -v
