name: Backend - pruebas de progreso
on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dorsales-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: prueba-local
          POSTGRES_DB: dorsales_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Reservas concurrentes en PostgreSQL descartable
        env:
          DORSAL_TEST_DATABASE_URL: postgresql://postgres:prueba-local@localhost:5432/dorsales_test
        run: python3 backend/tests/dorsales_postgres.py
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Probar backend (concurrencia limitada)
        run: npm test -- --test-concurrency=2
      - name: Probar generación de PDF (sin servicios externos)
        run: python3 -m unittest discover -s tests -p 'test_generar_certificado.py' -v
      - name: Instalar LibreOffice para conversión real
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libreoffice-impress
          python3 -m venv .venv-certificados
          .venv-certificados/bin/pip install python-pptx
      - name: Generar PDF real de prueba (sin datos de clientes)
        run: |
          .venv-certificados/bin/python - <<'PY'
          import base64
          import io
          from pptx import Presentation
          from generar_certificado import reemplazar_en_pptx, pptx_a_pdf_base64
          presentacion = Presentation()
          slide = presentacion.slides.add_slide(presentacion.slide_layouts[6])
          textbox = slide.shapes.add_textbox(0, 0, 4000000, 800000)
          textbox.text = 'Certificado {{NOMBRE_COMPLETO}}'
          salida = io.BytesIO()
          presentacion.save(salida)
          editado = reemplazar_en_pptx(salida.getvalue(), {'NOMBRE_COMPLETO': 'Usuario de prueba'})
          pdf = base64.b64decode(pptx_a_pdf_base64(editado, 'certificado'))
          assert pdf.startswith(b'%PDF-') and len(pdf) > 1000, 'PDF inválido o vacío'
          print(f'Conversión real OK: PDF de {len(pdf)} bytes')
          PY
